<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sigrid Rudebecks Gymnasium</title>
    <style>
        body {
            text-align: center;
        }


        /* Placera sökrutan */
        #searchBox {
            position: absolute;
            left: 220px;
            top: 100px;
            padding: 10px;
            width: 200px;
        }

        /* Placera sökknappen bredvid sökrutan */
        #searchButton {
            position: absolute;
            left: 430px;
            top: 100px;
            padding: 10px 15px;
            width: 100px;
        }

        #programHeader {
            position: absolute;
            left: 220px;
            top: 205px;
        }

        /* Årtalscontainer */
        #meritBox {
            background-color: #afafaf;  /* Ljusgrå bakgrund */
            padding: 160px;  /* Tillbaka till originalvärdet */
            width: 500px;  /* Bredd på rutan */
            margin: 20px auto;  /* Centrerar rutan på sidan */
            border-radius: 40px;  /* Rundade hörn */
            position: relative;
            top: 260px;
        }

        .year {
            margin: 0 35px;
            font-size: 20px;
            cursor: pointer;
            display: inline-block;
        }
        #yearContainer {
            text-align: center;
            margin-top: 50px; /* Gör mellanrummet större under meritBox */
            font-size: 20px;
            position: relative; /* Håller årtalen på rätt plats */
            top: 160px; /* Justerar så de hamnar under den gråa boxen */
        }

        .point {
            width: 10px;
            height: 10px;
            background-color: black;
            border-radius: 50%;
            position: absolute;
        }

        .meritText {
            font-size: 14px;
            color: black;
            font-weight: bold;
            text-align: center;
        }

        .selected {
            background-color: #555;  /* Mörkare bakgrundsfärg */
            color: white;  /* Ändra textfärgen till vit för kontrast */
        }

        #meritHeader {
            font-size: 24px;  /* Storlek */
            font-weight: bold;
            text-align: center;
            position: absolute; /* Förhindrar att den påverkar andra element */
            top: 360px; /* Justera placering över den gråa boxen */
            left: 50%;
            transform: translateX(-50%); /* Centrerar rubriken */
        }


    </style>
</head>
<body>
    <h1>Meritantagning Sigrid Rudebecks Gymnasium</h1>
    <h2 id="programSubtitle">Linje: Naturvetenskap</h2>
    <h2>___________________________________________</h2>

    <!-- Sökruta och sökknapp -->
    <input type="text" id="searchBox" placeholder="Sök efter gymnasium">
    <button id="searchButton">Sök</button>

    <h2 id="programHeader">Välj program:</h2>

    <h3 id="meritHeader"></h3> <!-- Lägg till denna rad -->
    
    <!-- Grå ruta för meritpoäng -->
    <div id="meritBox"></div>


    <!-- Årtalscontainer (måste finnas för att JavaScript ska fungera) -->
    <div id="yearContainer"></div>


    <!-- Länka till JavaScript -->
    <script src="script.js"></script>
</body>
</html>
